<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Badge Background -->
  <rect x="2" y="2" width="116" height="76" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- ISO Text -->
  <text x="60" y="28" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ISO
  </text>
  
  <!-- Certification Mark -->
  <text x="60" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1A76D1" text-anchor="middle" letter-spacing="0.5">
    9001:2015
  </text>
  
  <!-- Checkmark Circle -->
  <circle cx="60" cy="56" r="10" fill="none" stroke="#1A76D1" stroke-width="2"/>
  <polyline points="54,56 58,60 66,52" fill="none" stroke="#1A76D1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Certified Text -->
  <text x="60" y="74" font-family="'Manrope', sans-serif" font-size="7" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="0.5">
    CERTIFIED
  </text>
</svg>