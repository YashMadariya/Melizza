<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Medical Cross / Shield Icon -->
  <g transform="translate(0, 5)">
    <!-- Shield background -->
    <rect x="0" y="0" width="48" height="52" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Medical Cross -->
    <rect x="18" y="10" width="12" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="10" y="18" width="28" height="12" rx="2" fill="#FFFFFF"/>
    <!-- Capsule accent -->
    <rect x="8" y="40" width="32" height="6" rx="3" fill="#1A76D1" opacity="0.6"/>
  </g>
  
  <!-- Brand Name -->
  <text x="62" y="26" font-family="'Inter', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Melizza
  </text>
  
  <!-- Tagline -->
  <text x="62" y="46" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="2.5" text-transform="uppercase">
    LIFE SCIENCE
  </text>
</svg>